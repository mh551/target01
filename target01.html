<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子ターゲット コントローラー</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --primary: #238636;
      --primary-hover: #2ea043;
      --accent: #58a6ff;
      --danger: #da3633;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --warning-red: #ff1100;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      overflow-x: hidden;
    }

    /* アラート背景演出 (スピードアップ時) */
    body.fever-active {
      animation: alertBg 0.6s infinite alternate ease-in-out;
    }

    @keyframes alertBg {
      0% { background-color: var(--bg-color); }
      100% { background-color: #3a0000; }
    }

    .container {
      width: 100%;
      max-width: 500px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 20px;
      color: #ffffff;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    /* 警告オーバーレイ (WARNING 演出) */
    .warning-banner {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      transform: translateY(-50%) rotate(-5deg);
      background-color: rgba(255, 0, 0, 0.9);
      color: #fff;
      text-align: center;
      padding: 15px 0;
      font-weight: 900;
      font-size: 2rem;
      letter-spacing: 4px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
      z-index: 100;
      display: none;
      animation: bannerPulse 0.3s infinite alternate;
    }

    @keyframes bannerPulse {
      0% { transform: translateY(-50%) rotate(-5deg) scale(0.95); }
      100% { transform: translateY(-50%) rotate(-5deg) scale(1.05); }
    }

    /* カウントダウンオーバーレイ */
    .countdown-overlay {
      position: absolute;
      inset: 0;
      background: rgba(13, 17, 23, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 90;
    }

    .countdown-text {
      font-size: 6rem;
      font-weight: bold;
      color: var(--accent);
      animation: popText 0.8s ease-out infinite;
    }

    @keyframes popText {
      0% { transform: scale(0.5); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: scale(1.2); opacity: 0; }
    }

    .hidden {
      display: none !important;
    }

    /* ボタンデザイン */
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-connect {
      background-color: var(--accent);
      color: #fff;
      margin-bottom: 15px;
    }

    .btn-start {
      background-color: var(--primary);
      color: #fff;
      font-size: 1.2rem;
      margin-top: 15px;
    }

    .btn-start:disabled {
      background-color: var(--border-color);
      cursor: not-allowed;
    }

    .btn-danger {
      background-color: var(--danger);
      color: #fff;
    }

    /* ステータスバッジ */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 15px;
      background: rgba(0,0,0,0.2);
      padding: 8px 12px;
      border-radius: 6px;
    }

    .status-badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--danger);
      margin-right: 5px;
    }

    .status-badge.connected {
      background-color: var(--primary);
    }

    /* モード選択グリッド */
    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .mode-card {
      background: var(--bg-color);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-card:hover {
      border-color: var(--accent);
    }

    .mode-card.selected {
      border-color: var(--primary);
      background-color: rgba(35, 134, 54, 0.15);
    }

    .mode-title {
      font-weight: bold;
      margin-bottom: 4px;
      color: #fff;
    }

    .mode-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ゲーム画面用スコアボード */
    .game-board {
      text-align: center;
      padding: 20px 0;
    }

    .score-label {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .score-val {
      font-size: 4rem;
      font-weight: bold;
      color: #fff;
      line-height: 1;
      margin: 10px 0;
    }

    .timer-val {
      font-size: 1.8rem;
      color: var(--accent);
      font-family: monospace;
    }

    /* 履歴テーブル */
    .history-section {
      margin-top: 20px;
      border-top: 1px solid var(--border-color);
      padding-top: 15px;
    }

    .history-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th, td {
      padding: 6px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- WARNING演出用バンナー -->
    <div id="warningBanner" class="warning-banner">FEVER TIME!!</div>

    <!-- カウントダウン用オーバーレイ -->
    <div id="countdownOverlay" class="countdown-overlay hidden">
      <div id="countdownText" class="countdown-text">3</div>
    </div>

    <h1>TARGET CONTROLLER</h1>

    <!-- ステータス表示 -->
    <div class="status-bar">
      <div>
        <span id="statusBadge" class="status-badge"></span>
        <span id="statusText">未接続</span>
      </div>
      <button id="btnConnect" class="btn-connect" style="width: auto; padding: 4px 10px; margin: 0;">接続</button>
    </div>

    <!-- パネル1: モード選択 ＆ スタート -->
    <div id="panelGameSetup">
      <div class="mode-grid">
        <div class="mode-card" onclick="selectMode(1)" id="modeCard1">
          <div class="mode-title">1. スピード測定</div>
          <div class="mode-desc">4枚全倒しにかかった時間を計測</div>
        </div>
        <div class="mode-card" onclick="selectMode(2)" id="modeCard2">
          <div class="mode-title">2. モグラたたき</div>
          <div class="mode-desc">制限時間内にランダム起き上がりを撃ち抜け</div>
        </div>
        <div class="mode-card" onclick="selectMode(3)" id="modeCard3">
          <div class="mode-title">3. 精度トレーニング</div>
          <div class="mode-desc">1枚ずつ順番に起き上がるターゲットを狙え</div>
        </div>
        <div class="mode-card" onclick="selectMode(4)" id="modeCard4">
          <div class="mode-title">4. アペックス</div>
          <div class="mode-desc">高難易度・ランダムパターン挑戦</div>
        </div>
      </div>

      <button id="btnStart" class="btn-start" onclick="pressStart()" disabled>GAME START</button>
    </div>

    <!-- パネル2: ゲームプレイ中 -->
    <div id="panelPlaying" class="hidden">
      <div class="game-board">
        <div class="score-label">SCORE / TARGETS</div>
        <div id="displayScore" class="score-val">0</div>
        <div id="displayTimer" class="timer-val">00.0s</div>
      </div>
      <button class="btn-danger" onclick="stopGame()">STOP GAME</button>
    </div>

    <!-- リザルト履歴 -->
    <div class="history-section">
      <div class="history-title">最近のスコア履歴</div>
      <table>
        <thead>
          <tr>
            <th>Mode</th>
            <th>Score</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="historyTableBody">
          <!-- JSで動的挿入 -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // --- BLE設定情報 ---
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bluetoothDevice = null;
    let targetCharacteristic = null;

    let selectedMode = 0;
    let timerInterval = null;
    let startTime = 0;

    // --- Web Audio API（効果音再生用） ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(freq, duration) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // --- BLE 接続処理 ---
    document.getElementById('btnConnect').addEventListener('click', async () => {
      try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: "ESP32_Target_Game" }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        targetCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        await targetCharacteristic.startNotifications();
        targetCharacteristic.addEventListener('characteristicvaluechanged', handleData);

        // UI更新
        document.getElementById('statusBadge').classList.add('connected');
        document.getElementById('statusText').textContent = "接続完了";
        document.getElementById('btnConnect').style.display = 'none';

      } catch (error) {
        console.error("BLE Connection Error:", error);
        alert("接続に失敗しました: " + error);
      }
    });

    // --- 受信データ処理 ---
    function handleData(event) {
      const value = new TextDecoder().decode(event.target.value).trim();
      console.log("Received:", value);

      if (value.startsWith("HIT:")) {
        const score = value.split(":")[1];
        document.getElementById('displayScore').textContent = score;
        playBeep(1200, 0.08); // ヒットSE
      } 
      // ESP32からの SPEED_UP 通知を受信してWARNING演出を同期発生
      else if (value === "SPEED_UP") {
        triggerWarningSequence();
      }
      else if (value.startsWith("TIME_UP:")) {
        stopTimer();
        const finalScore = parseInt(value.split(":")[1]) || 0;
        saveResultAndNext(finalScore, 60.0);
      } 
      else if (value.startsWith("CLEAR:")) {
        stopTimer();
        const clearTime = parseFloat(value.split(":")[1]) || 0.0;
        saveResultAndNext(4, clearTime);
      }
    }

    // --- コマンド送信 ---
    async function sendCommand(cmd) {
      if (!targetCharacteristic) return;
      try {
        const encoder = new TextEncoder();
        await targetCharacteristic.writeValue(encoder.encode(cmd));
      } catch (error) {
        console.error("Send Command Error:", error);
      }
    }

    // --- モード選択 ---
    function selectMode(mode) {
      selectedMode = mode;
      for (let i = 1; i <= 4; i++) {
        document.getElementById(`modeCard${i}`).classList.remove('selected');
      }
      document.getElementById(`modeCard${mode}`).classList.add('selected');
      document.getElementById('btnStart').disabled = false;
    }

    // --- スタートボタン押下 ---
    function pressStart() {
      if (selectedMode === 0) return;

      // カウントダウン開始と同時にESP32へスタートコマンドを送信（サーボの起立準備を即座に開始）
      sendCommand("START_MODE" + selectedMode);

      const overlay = document.getElementById('countdownOverlay');
      const textEl = document.getElementById('countdownText');
      overlay.classList.remove('hidden');

      let count = 3;
      textEl.textContent = count;
      playBeep(440, 0.15);

      const countdownTimer = setInterval(() => {
        count--;
        if (count > 0) {
          textEl.textContent = count;
          playBeep(440, 0.15);
        } else if (count === 0) {
          textEl.textContent = "GO!";
          playBeep(880, 0.4);
        } else {
          clearInterval(countdownTimer);
          overlay.classList.add('hidden');

          // 画面切り替え & Webタイマー開始
          document.getElementById('panelGameSetup').classList.add('hidden');
          document.getElementById('panelPlaying').classList.remove('hidden');

          startTimer();
        }
      }, 1000);
    }

    // --- WARNING（フィーバータイム）演出の実行 ---
    function triggerWarningSequence() {
      const banner = document.getElementById('warningBanner');
      document.body.classList.add('fever-active');
      banner.style.display = 'block';

      // ブザー音発生
      playBeep(300, 0.5);

      setTimeout(() => {
        banner.style.display = 'none';
        document.body.classList.remove('fever-active');
      }, 2500);
    }

    // --- タイマー処理 ---
    function startTimer() {
      startTime = Date.now();
      document.getElementById('displayScore').textContent = "0";

      timerInterval = setInterval(() => {
        const elapsed = (Date.now() - startTime) / 1000;
        document.getElementById('displayTimer').textContent = elapsed.toFixed(1) + "s";
      }, 100);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    // --- ゲーム途中停止 ---
    function stopGame() {
      stopTimer();
      sendCommand("STOP");
      document.getElementById('panelPlaying').classList.add('hidden');
      document.getElementById('panelGameSetup').classList.remove('hidden');
      document.body.classList.remove('fever-active');
      document.getElementById('warningBanner').style.display = 'none';
    }

    // --- リザルト記録 & パネル切り替え ---
    function saveResultAndNext(score, timeVal) {
      document.getElementById('panelPlaying').classList.add('hidden');
      document.getElementById('panelGameSetup').classList.remove('hidden');

      const tbody = document.getElementById('historyTableBody');
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>Mode ${selectedMode}</td>
        <td>${score} pts</td>
        <td>${timeVal.toFixed(1)}s</td>
      `;
      tbody.insertBefore(row, tbody.firstChild);
    }
  </script>
</body>
</html>
