<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 シューティングターゲット</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    h1 { color: #00e676; font-size: 22px; margin-bottom: 20px; }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    button {
      border: none;
      padding: 15px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      width: 100%;
      margin: 8px 0;
      cursor: pointer;
    }
    .btn-connect { background-color: #29b6f6; color: #fff; }
    .btn-start { background-color: #ff3d00; color: #fff; font-size: 20px; }
    button:active { opacity: 0.8; }
    
    .mode-select {
      text-align: left;
      margin: 15px 0;
      font-size: 16px;
    }
    .mode-select label {
      display: block;
      padding: 10px;
      background: #2a2a2a;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .mode-select input { margin-right: 10px; transform: scale(1.3); }

    .log-box {
      background: #000;
      color: #00ff00;
      font-family: monospace;
      padding: 10px;
      border-radius: 6px;
      height: 220px;
      overflow-y: scroll;
      text-align: left;
      font-size: 14px;
      line-height: 1.4;
    }
    #status { font-size: 14px; color: #aaa; margin-bottom: 10px; }
  </style>
</head>
<body>

  <h1>🎯 ESP32 Target Controller</h1>
  
  <div class="card">
    <div id="status">状態: 未接続</div>
    <button class="btn-connect" onclick="connectBT()">1. Bluetooth 接続</button>
  </div>

  <div class="card">
    <h3>2. モード選択</h3>
    <div class="mode-select">
      <label>
        <input type="radio" name="gameMode" value="1" checked> 1: 60秒タイムアタック
      </label>
      <label>
        <input type="radio" name="gameMode" value="2"> 2: スピードクリア (一斉起立)
      </label>
    </div>
    <button class="btn-start" onclick="startGame()">▶ GAME START</button>
  </div>

  <div class="card">
    <h3>スコア・実況ログ</h3>
    <div id="log" class="log-box"></div>
  </div>

  <script>
    const SERVICE_UUID           = "00001101-0000-1000-8000-00805f9b34fb";
    const CHARACTERISTIC_UUID_RX = "00001102-0000-1000-8000-00805f9b34fb";
    const CHARACTERISTIC_UUID_TX = "00001103-0000-1000-8000-00805f9b34fb";

    let bluetoothDevice;
    let rxCharacteristic;

    async function connectBT() {
      try {
        document.getElementById('status').innerText = '全デバイスを検索中...';
        
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        document.getElementById('status').innerText = '接続処理中...';

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
        
        const txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);
        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', handleData);

        document.getElementById('status').innerText = '接続成功: ' + (bluetoothDevice.name || 'ESP32');
        log('--- 接続完了！モードを選んでSTARTを押してください ---');

      } catch (error) {
        console.error(error);
        document.getElementById('status').innerText = '接続失敗';
        log('エラー: ' + error);
      }
    }

    async function startGame() {
      if (!rxCharacteristic) {
        alert('先に「Bluetooth 接続」を行ってください。');
        return;
      }
      
      // 選択されているラジオボタンの値を取得 ('1' または '2')
      const selectedMode = document.querySelector('input[name="gameMode"]:checked').value;
      
      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(selectedMode));
      } catch (error) {
        log('送信エラー: ' + error);
      }
    }

    function handleData(event) {
      const decoder = new TextDecoder('utf-8');
      const text = decoder.decode(event.target.value);
      log(text);
    }

    function log(msg) {
      const logBox = document.getElementById('log');
      logBox.innerHTML += msg.replace(/\n/g, '<br>');
      logBox.scrollTop = logBox.scrollHeight;
    }
  </script>
</body>
</html>
