<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 ターゲットシューティング</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #00e676;
      --danger-color: #ff5252;
      --text-color: #ffffff;
      --sub-text: #aaaaaa;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      font-size: 1.8rem;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .btn {
      background-color: #333;
      color: var(--text-color);
      border: 2px solid #555;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      box-sizing: border-box;
      margin-top: 8px;
    }

    .btn:hover:not(:disabled) {
      background-color: #444;
      border-color: #777;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-connect {
      background-color: #29b6f6;
      border-color: #0288d1;
      color: #000;
    }

    .btn-stop {
      background-color: var(--danger-color);
      border-color: #d32f2f;
      color: #fff;
    }

    .status-text {
      font-size: 0.9rem;
      color: var(--sub-text);
      margin-top: 5px;
    }

    .status-connected {
      color: var(--accent-color);
      font-weight: bold;
    }

    .display-box {
      font-size: 3rem;
      font-weight: bold;
      margin: 10px 0;
      letter-spacing: 2px;
    }

    .score-val {
      color: var(--accent-color);
    }

    .fever {
      color: #ffeb3b;
      animation: blink 0.5s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 1; }
      to { opacity: 0.3; }
    }

    .mode-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .log-area {
      background: #000;
      color: #0f0;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 10px;
      height: 100px;
      overflow-y: auto;
      border-radius: 6px;
      text-align: left;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>ターゲットシューティング</h1>

  <!-- 接続制御 -->
  <div class="card">
    <button id="btnConnect" class="btn btn-connect" onclick="connectBLE()">Bluetooth 接続</button>
    <div id="statusText" class="status-text">未接続</div>
  </div>

  <!-- ディスプレイエリア -->
  <div class="card">
    <div class="status-text">ステータス / メッセージ</div>
    <div id="displayMsg" class="display-box">READY</div>
    <div class="status-text">スコア / タイム</div>
    <div id="displayScore" class="display-box score-val">0</div>
  </div>

  <!-- コントロールボタン -->
  <div class="card">
    <div class="mode-group">
      <button class="btn game-btn" onclick="startGame(1)" disabled>① タイムアタック (60秒)</button>
      <button class="btn game-btn" onclick="startGame(2)" disabled>② スピードクリア (全倒し)</button>
      <button class="btn game-btn" onclick="startGame(3)" disabled>③ モグラたたき (60秒)</button>
      <button class="btn btn-stop game-btn" onclick="stopGame()" disabled>STOP (強制終了)</button>
    </div>
  </div>

  <!-- 通信ログ -->
  <div class="card">
    <div class="status-text" style="margin-bottom: 5px;">受信ログ</div>
    <div id="logArea" class="log-area"></div>
  </div>
</div>

<script>
  // C++コードのUUID設定と一致させる
  const SERVICE_UUID           = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
  const CHARACTERISTIC_UUID_RX = "beb5483e-36e1-4688-b7f5-ea07361b26a8"; 
  const CHARACTERISTIC_UUID_TX = "8260c02c-502a-466d-a19e-e31448b1116b"; 

  let bleDevice = null;
  let rxCharacteristic = null;
  let txCharacteristic = null;

  const btnConnect = document.getElementById('btnConnect');
  const statusText = document.getElementById('statusText');
  const displayMsg = document.getElementById('displayMsg');
  const displayScore = document.getElementById('displayScore');
  const logArea = document.getElementById('logArea');
  const gameButtons = document.querySelectorAll('.game-btn');

  // BLE接続処理
  async function connectBLE() {
    try {
      log("Bluetoothデバイスを検索中...");
      bleDevice = await navigator.bluetooth.requestDevice({
  acceptAllDevices: true,
  optionalServices: [SERVICE_UUID]
});

      bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

      log("GATTサーバーへ接続中...");
      const server = await bleDevice.gatt.connect();

      log("サービスを取得中...");
      const service = await server.getPrimaryService(SERVICE_UUID);

      log("キャラクタリスティクを取得中...");
      rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
      txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);

      // 通知（Notify）の受け取り設定
      await txCharacteristic.startNotifications();
      txCharacteristic.addEventListener('characteristicvaluechanged', handleData);

      statusText.textContent = "接続完了: " + bleDevice.name;
      statusText.classList.add("status-connected");
      btnConnect.textContent = "切断";
      btnConnect.onclick = disconnectBLE;

      // ボタンの有効化
      setButtonsEnabled(true);
      log("接続が完了しました。");

    } catch (error) {
      log("エラー: " + error);
      console.error(error);
    }
  }

  // 切断処理
  function disconnectBLE() {
    if (bleDevice && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
    }
  }

  function onDisconnected() {
    statusText.textContent = "未接続";
    statusText.classList.remove("status-connected");
    btnConnect.textContent = "Bluetooth 接続";
    btnConnect.onclick = connectBLE;
    setButtonsEnabled(false);
    displayMsg.textContent = "OFFLINE";
    displayMsg.classList.remove("fever");
    log("切断されました。");
  }

  // 受信データのハンドリング
  function handleData(event) {
    const value = new TextDecoder().decode(event.target.value);
    log("受信: " + value);

    if (value === "3" || value === "2" || value === "1") {
      displayMsg.textContent = value;
      displayMsg.classList.remove("fever");
      displayScore.textContent = "0";
    } 
    else if (value === "GO") {
      displayMsg.textContent = "START!";
    } 
    else if (value.startsWith("HIT:")) {
      const score = value.split(":")[1];
      displayScore.textContent = score;
    } 
    else if (value.startsWith("TIME_UP:")) {
      const finalScore = value.split(":")[1];
      displayMsg.textContent = "FINISH!";
      displayMsg.classList.remove("fever");
      displayScore.textContent = finalScore;
    } 
    else if (value.startsWith("CLEAR:")) {
      const clearTime = value.split(":")[1];
      displayMsg.textContent = "CLEAR!";
      displayScore.textContent = clearTime + "s";
    } 
    else if (value === "SPEED_UP") {
      displayMsg.textContent = "FEVER!";
      displayMsg.classList.add("fever");
    }
  }

  // コマンド送信関数
  async function sendCommand(cmd) {
    if (!rxCharacteristic) return;
    try {
      const encoder = new TextEncoder();
      await rxCharacteristic.writeValue(encoder.encode(cmd));
      log("送信: " + cmd);
    } catch (error) {
      log("送信エラー: " + error);
    }
  }

  // ゲーム開始指示
  function startGame(modeNum) {
    displayMsg.classList.remove("fever");
    displayMsg.textContent = "STANDBY";
    sendCommand("START_MODE" + modeNum);
  }

  // ゲーム停止指示
  function stopGame() {
    displayMsg.classList.remove("fever");
    displayMsg.textContent = "STOPPED";
    sendCommand("STOP");
  }

  // ボタン有効/無効切り替え
  function setButtonsEnabled(enabled) {
    gameButtons.forEach(btn => btn.disabled = !enabled);
  }

  // ログ出力関数
  function log(message) {
    const now = new Date().toLocaleTimeString();
    logArea.innerHTML += `[${now}] ${message}<br>`;
    logArea.scrollTop = logArea.scrollHeight;
  }
</script>
</body>
</html>
