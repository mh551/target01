<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ターゲットシューティング</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121214;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
      min-height: 100vh;
    }
    h1 { font-size: 1.4rem; color: #aaaaaa; margin-bottom: 10px; }
    
    .status-badge {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      background-color: #333336;
      color: #ffcc00;
      margin-bottom: 15px;
    }
    .status-badge.connected {
      background-color: #1b3a24;
      color: #30d158;
      border: 1px solid #30d158;
    }

    /* メイン表示パネル */
    .display-panel {
      width: 100%;
      max-width: 380px;
      background: #1c1c1e;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      border: 1px solid #2c2c2e;
      margin-bottom: 20px;
    }
    .status-text {
      font-size: 3.2rem;
      font-weight: 900;
      color: #ffd60a;
      min-height: 4rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .score-text {
      font-size: 3.5rem;
      font-weight: 900;
      color: #ffffff;
      font-family: monospace;
    }

    /* コントロールエリア */
    .control-panel {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* モード選択エリア（ラジオボタン風カード） */
    .mode-select-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mode-option {
      display: flex;
      align-items: center;
      background: #2c2c2e;
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .mode-option input { display: none; }
    .mode-option.selected {
      border-color: #0a84ff;
      background: #1a2a3a;
    }
    .mode-title { font-weight: bold; font-size: 1.05rem; }

    /* ボタン類 */
    button {
      width: 100%;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }
    button:active { transform: scale(0.98); }
    
    .btn-connect { background-color: #0a84ff; color: #ffffff; }
    .btn-start { background-color: #30d158; color: #000000; }
    .btn-stop { background-color: #ff453a; color: #ffffff; }
  </style>
</head>
<body>

  <h1>TARGET SHOOTING</h1>
  <div id="connectionStatus" class="status-badge">① まずBluetooth接続してください</div>

  <div class="display-panel">
    <div id="statusText" class="status-text">READY</div>
    <div id="scoreText" class="score-text">SCORE: 0</div>
  </div>

  <div class="control-panel">
    <!-- Bluetooth接続ボタン -->
    <button id="btnConnect" class="btn-connect" onclick="connectBLE()">
      📲 Bluetooth 機器を接続
    </button>

    <!-- モード選択グループ -->
    <div class="mode-select-group">
      <label class="mode-option selected" id="labelMode1">
        <input type="radio" name="gameMode" value="1" checked onchange="selectMode(1)">
        <span class="mode-title">⏱️ 1. タイムアタック</span>
      </label>
      <label class="mode-option" id="labelMode2">
        <input type="radio" name="gameMode" value="2" onchange="selectMode(2)">
        <span class="mode-title">⚡ 2. スピードクリア</span>
      </label>
      <label class="mode-option" id="labelMode3">
        <input type="radio" name="gameMode" value="3" onchange="selectMode(3)">
        <span class="mode-title">👾 3. モグラたたき</span>
      </label>
    </div>

    <!-- スタートボタン（単一） -->
    <button class="btn-start" onclick="startGame()">
      ▶ スタート
    </button>

    <button class="btn-stop" onclick="stopGame()">
      ⏹ 中断 / リセット
    </button>
  </div>

  <script>
    const SERVICE_UUID           = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const CHARACTERISTIC_UUID_RX = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
    const CHARACTERISTIC_UUID_TX = '8260c02c-502a-466d-a19e-e31448b1116b';

    let rxCharacteristic = null;
    let audioCtx = null;
    let selectedModeNum = 1;
    let countdownTimer = null;

    // モード選択時の表示変更
    function selectMode(modeNum) {
      selectedModeNum = modeNum;
      for (let i = 1; i <= 3; i++) {
        const label = document.getElementById('labelMode' + i);
        if (i === modeNum) {
          label.classList.add('selected');
        } else {
          label.classList.remove('selected');
        }
      }
    }

    // iPhone用 Web Audio API (効果音)
    function playBeep(freq, duration) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.error(e);
      }
    }

    // Bluetooth 接続処理
    async function connectBLE() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      try {
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        document.getElementById('connectionStatus').innerText = '接続中...';

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
        const txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);

        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', handleBLEData);

        document.getElementById('connectionStatus').innerText = '✅ 接続完了！スタートを押してください';
        document.getElementById('connectionStatus').classList.add('connected');
        document.getElementById('btnConnect').style.display = 'none';

      } catch (err) {
        console.error(err);
        alert('接続できませんでした。ESP32の電源とBluetoothを確認してください。');
        document.getElementById('connectionStatus').innerText = '接続失敗';
      }
    }

    // スタートボタン押下時
    async function startGame() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      if (!rxCharacteristic) {
        alert('先に「Bluetooth 機器を接続」ボタンを押してください。');
        return;
      }

      if (countdownTimer) clearInterval(countdownTimer);

      document.getElementById('scoreText').innerText = 'SCORE: 0';

      try {
        const encoder = new TextEncoder();
        // ESP32に選択されたモードを送信
        await rxCharacteristic.writeValue(encoder.encode('START_MODE' + selectedModeNum));
      } catch (err) {
        console.error(err);
      }
    }

    // ゲーム停止
    async function stopGame() {
      if (countdownTimer) clearInterval(countdownTimer);
      if (rxCharacteristic) {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode('STOP'));
      }
      document.getElementById('statusText').innerText = 'READY';
    }

    // ESP32からの通知受信用
    function handleBLEData(event) {
      const decoder = new TextDecoder();
      const msg = decoder.decode(event.target.value).trim();
      console.log('受信:', msg);

      // ① カウントダウン開始通知を受信したら JavaScript 側で順にカウントを実行
      if (msg === 'COUNTDOWN') {
        startSequenceCountdown();
      } 
      // ② ヒット時
      else if (msg.startsWith('HIT:')) {
        const score = msg.split(':')[1];
        document.getElementById('scoreText').innerText = 'SCORE: ' + score;
        playBeep(523, 0.1);
      } 
      // ③ タイムアップ / クリア時
      else if (msg.startsWith('TIME_UP') || msg.startsWith('CLEAR:')) {
        if (countdownTimer) clearInterval(countdownTimer);
        document.getElementById('statusText').innerText = 'FINISH!';
        playBeep(220, 0.5);
      }
    }

    // 画面の順次カウントダウン（3 ➔ 2 ➔ 1 ➔ GO!!）
    function startSequenceCountdown() {
      if (countdownTimer) clearInterval(countdownTimer);

      let count = 3;
      document.getElementById('statusText').innerText = count;
      playBeep(440, 0.15); // 「3」の音

      countdownTimer = setInterval(() => {
        count--;
        if (count > 0) {
          document.getElementById('statusText').innerText = count;
          playBeep(440, 0.15); // 「2」「1」の音
        } else {
          clearInterval(countdownTimer);
          document.getElementById('statusText').innerText = 'GO!!';
          playBeep(880, 0.4);  // 「GO!!」の音（起立タイミングと完全同期）
        }
      }, 1000);
    }
  </script>
</body>
</html>
