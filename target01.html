<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ターゲットシューティング</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121214;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
      min-height: 100vh;
    }
    h1 { font-size: 1.4rem; color: #aaaaaa; margin-bottom: 10px; }
    
    .status-badge {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      background-color: #333336;
      color: #ffcc00;
      margin-bottom: 15px;
    }
    .status-badge.connected {
      background-color: #1b3a24;
      color: #30d158;
      border: 1px solid #30d158;
    }
    .status-badge.disconnected {
      background-color: #3a1b1b;
      color: #ff453a;
      border: 1px solid #ff453a;
    }

    .display-panel {
      width: 100%;
      max-width: 380px;
      background: #1c1c1e;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      border: 1px solid #2c2c2e;
      margin-bottom: 20px;
    }
    .status-text {
      font-size: 3.5rem;
      font-weight: 900;
      color: #ffd60a;
      min-height: 4.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .timer-text {
      font-size: 2.2rem;
      font-weight: bold;
      color: #30d158;
      font-family: monospace;
      margin-top: 5px;
    }
    .score-text {
      font-size: 2.2rem;
      font-weight: bold;
      color: #ffffff;
      font-family: monospace;
      margin-top: 5px;
    }

    .control-panel {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .mode-select-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mode-option {
      display: flex;
      align-items: center;
      background: #2c2c2e;
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .mode-option input { display: none; }
    .mode-option.selected {
      border-color: #0a84ff;
      background: #1a2a3a;
    }
    .mode-title { font-weight: bold; font-size: 1.05rem; }

    button {
      width: 100%;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }
    button:active { transform: scale(0.98); }
    
    .btn-connect { background-color: #0a84ff; color: #ffffff; }
    .btn-start { background-color: #30d158; color: #000000; }
    .btn-stop { background-color: #ff453a; color: #ffffff; }
  </style>
</head>
<body>

  <h1>TARGET SHOOTING</h1>
  <div id="connectionStatus" class="status-badge">① まずBluetooth接続してください</div>

  <div class="display-panel">
    <div id="statusText" class="status-text">READY</div>
    <div id="timerText" class="timer-text">TIME: 0.0</div>
    <div id="scoreText" class="score-text">SCORE: 0</div>
  </div>

  <div class="control-panel">
    <button id="btnConnect" class="btn-connect" onclick="connectBLE()">
      📲 Bluetooth 機器を接続
    </button>

    <div class="mode-select-group">
      <label class="mode-option selected" id="labelMode1">
        <input type="radio" name="gameMode" value="1" checked onchange="selectMode(1)">
        <span class="mode-title">⏱️ 1. タイムアタック</span>
      </label>
      <label class="mode-option" id="labelMode2">
        <input type="radio" name="gameMode" value="2" onchange="selectMode(2)">
        <span class="mode-title">⚡ 2. スピードクリア</span>
      </label>
      <label class="mode-option" id="labelMode3">
        <input type="radio" name="gameMode" value="3" onchange="selectMode(3)">
        <span class="mode-title">👾 3. モグラたたき</span>
      </label>
    </div>

    <button class="btn-start" onclick="startGame()">
      ▶ スタート
    </button>

    <button class="btn-stop" onclick="stopGame()">
      ⏹ 中断 / リセット
    </button>
  </div>

  <script>
    const SERVICE_UUID           = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const CHARACTERISTIC_UUID_RX = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
    const CHARACTERISTIC_UUID_TX = '8260c02c-502a-466d-a19e-e31448b1116b';

    let bluetoothDevice = null;
    let rxCharacteristic = null;
    let audioCtx = null;
    let selectedModeNum = 1;
    let gameTimer = null;
    let startTime = 0;

    function selectMode(modeNum) {
      selectedModeNum = modeNum;
      for (let i = 1; i <= 3; i++) {
        const label = document.getElementById('labelMode' + i);
        if (i === modeNum) label.classList.add('selected');
        else label.classList.remove('selected');
      }
    }

    function playBeep(freq, duration) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { console.error(e); }
    }

    async function connectBLE() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        // 切断イベントの自動ハンドリング登録
        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

        document.getElementById('connectionStatus').innerText = '接続中...';
        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
        const txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);

        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', handleBLEData);

        const statusBadge = document.getElementById('connectionStatus');
        statusBadge.innerText = '✅ 接続完了！';
        statusBadge.className = 'status-badge connected';
        document.getElementById('btnConnect').style.display = 'none';

      } catch (err) {
        console.error(err);
        alert('接続に失敗しました。');
        resetConnectionUI('❌ 接続失敗');
      }
    }

    // 切断されたときの自動復帰処理
    function onDisconnected(event) {
      console.log('Bluetooth切断検出');
      stopTimerUI();
      rxCharacteristic = null;
      resetConnectionUI('⚠️ 切断されました（再接続してください）');
    }

    function resetConnectionUI(msg) {
      const statusBadge = document.getElementById('connectionStatus');
      statusBadge.innerText = msg;
      statusBadge.className = 'status-badge disconnected';
      
      const btnConnect = document.getElementById('btnConnect');
      btnConnect.style.display = 'block';
      btnConnect.innerText = '🔄 Bluetooth 再接続';
    }

    async function startGame() {
      if (!rxCharacteristic) {
        alert('Bluetoothが切断されています。再接続してください。');
        return;
      }
      stopTimerUI();
      document.getElementById('statusText').innerText = 'READY';
      document.getElementById('scoreText').innerText = 'SCORE: 0';
      document.getElementById('timerText').innerText = 'TIME: 0.0';

      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode('START_MODE' + selectedModeNum));
      } catch (err) { 
        console.error('送信エラー:', err);
        alert('送信に失敗しました。再接続をお試しください。');
      }
    }

    async function stopGame() {
      stopTimerUI();
      if (rxCharacteristic) {
        try {
          const encoder = new TextEncoder();
          await rxCharacteristic.writeValue(encoder.encode('STOP'));
        } catch (e) { console.error(e); }
      }
      document.getElementById('statusText').innerText = 'READY';
    }

    function stopTimerUI() {
      if (gameTimer) {
        clearInterval(gameTimer);
        gameTimer = null;
      }
    }

    function handleBLEData(event) {
      const decoder = new TextDecoder();
      const msg = decoder.decode(event.target.value).trim();
      console.log('受信:', msg);

      if (msg === '3' || msg === '2' || msg === '1') {
        document.getElementById('statusText').innerText = msg;
        playBeep(440, 0.15);
      } 
      else if (msg === 'GO' || msg === 'GAME_START') {
        document.getElementById('statusText').innerText = 'GO!!';
        playBeep(880, 0.4);
        
        startTime = Date.now();
        stopTimerUI();
        gameTimer = setInterval(() => {
          const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
          document.getElementById('timerText').innerText = 'TIME: ' + elapsed;
        }, 100);
      } 
      else if (msg.startsWith('HIT:')) {
        const score = msg.split(':')[1];
        document.getElementById('scoreText').innerText = 'SCORE: ' + score;
        playBeep(523, 0.1);
      } 
      else if (msg.startsWith('CLEAR:')) {
        stopTimerUI();
        const clearTime = msg.split(':')[1];
        document.getElementById('statusText').innerText = 'CLEAR!';
        document.getElementById('timerText').innerText = 'TIME: ' + clearTime;
        playBeep(1046, 0.6);
      }
      else if (msg.startsWith('TIME_UP')) {
        stopTimerUI();
        document.getElementById('statusText').innerText = 'FINISH!';
        playBeep(220, 0.5);
      }
    }
  </script>
</body>
</html>
