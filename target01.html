<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ターゲットシューティング</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121214;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
      min-height: 100vh;
    }
    h1 { font-size: 1.4rem; color: #aaaaaa; margin-bottom: 10px; }
    
    .status-badge {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      background-color: #333336;
      color: #ffcc00;
      margin-bottom: 15px;
    }
    .status-badge.connected {
      background-color: #1b3a24;
      color: #30d158;
      border: 1px solid #30d158;
    }

    /* 表示パネル */
    .display-panel {
      width: 100%;
      max-width: 380px;
      background: #1c1c1e;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      border: 1px solid #2c2c2e;
      margin-bottom: 20px;
    }
    .status-text {
      font-size: 2.8rem;
      font-weight: 900;
      color: #ffd60a;
      min-height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .score-text {
      font-size: 3.5rem;
      font-weight: 900;
      color: #ffffff;
      font-family: monospace;
    }

    /* 操作ボタン */
    .control-panel {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }
    button:active { transform: scale(0.98); }
    
    .btn-connect { background-color: #0a84ff; color: #ffffff; }
    .btn-start { background-color: #30d158; color: #000000; }
    .btn-stop { background-color: #ff453a; color: #ffffff; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>TARGET SHOOTING</h1>
  <div id="connectionStatus" class="status-badge">① まずBluetooth接続してください</div>

  <div class="display-panel">
    <div id="statusText" class="status-text">READY</div>
    <div id="scoreText" class="score-text">SCORE: 0</div>
  </div>

  <div class="control-panel">
    <!-- Bluetooth接続ボタン -->
    <button id="btnConnect" class="btn-connect" onclick="connectBLE()">
      📲 1. Bluetooth 機器を接続
    </button>

    <!-- スタートボタン（常時表示） -->
    <button class="btn-start" onclick="startGame(1)">
      ▶ タイムアタック スタート
    </button>
    <button class="btn-start" onclick="startGame(2)">
      ▶ スピードクリア スタート
    </button>
    <button class="btn-start" onclick="startGame(3)">
      ▶ モグラたたき スタート
    </button>

    <button class="btn-stop" onclick="stopGame()">
      ⏹ ゲーム停止
    </button>
  </div>

  <script>
    const SERVICE_UUID           = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const CHARACTERISTIC_UUID_RX = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
    const CHARACTERISTIC_UUID_TX = '8260c02c-502a-466d-a19e-e31448b1116b';

    let rxCharacteristic = null;
    let audioCtx = null;

    // iPhone用 Web Audio API (効果音)
    function playBeep(freq, duration) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.error(e);
      }
    }

    // Bluetooth 接続処理
    async function connectBLE() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      try {
        // デバイス検索（全機器検索またはUUID指定）
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        document.getElementById('connectionStatus').innerText = '接続中...';

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
        const txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);

        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', handleBLEData);

        document.getElementById('connectionStatus').innerText = '✅ 接続完了！スタートを押してください';
        document.getElementById('connectionStatus').classList.add('connected');
        document.getElementById('btnConnect').style.display = 'none';

      } catch (err) {
        console.error(err);
        alert('接続できませんでした。ESP32の電源とBluetoothがオンか確認してください。');
        document.getElementById('connectionStatus').innerText = '接続失敗';
      }
    }

    // ゲーム開始ボタン押下時
    async function startGame(modeNumber) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      if (!rxCharacteristic) {
        alert('先に「Bluetooth 機器を接続」ボタンを押して接続してください。');
        return;
      }

      document.getElementById('scoreText').innerText = 'SCORE: 0';
      document.getElementById('statusText').innerText = '3';

      try {
        const encoder = new TextEncoder();
        // ESP32へスタートコマンド送信（これでESP32側のカウントダウンが発動）
        await rxCharacteristic.writeValue(encoder.encode('START_MODE' + modeNumber));
      } catch (err) {
        console.error(err);
      }
    }

    // ゲーム停止
    async function stopGame() {
      if (rxCharacteristic) {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode('STOP'));
      }
      document.getElementById('statusText').innerText = 'READY';
    }

    // ESP32からの通知受信用
    function handleBLEData(event) {
      const decoder = new TextDecoder();
      const msg = decoder.decode(event.target.value).trim();
      console.log('受信:', msg);

      // ① ESP32からカウントダウン開始信号を受信したら画面で 3 -> 2 -> 1 カウント開始
      if (msg === 'COUNTDOWN') {
        runCountdownUI();
      } 
      // ② ESP32がターゲットを起こした瞬間に「GO!!」表示＆スタート音
      else if (msg === 'GAME_START') {
        document.getElementById('statusText').innerText = 'GO!!';
        playBeep(880, 0.4); // 高いスタート音（ピー！）
      } 
      // ③ ヒット時
      else if (msg.startsWith('HIT:')) {
        const score = msg.split(':')[1];
        document.getElementById('scoreText').innerText = 'SCORE: ' + score;
        playBeep(523, 0.1); // ヒット音（ピッ）
      } 
      // ④ タイムアップ / クリア時
      else if (msg.startsWith('TIME_UP') || msg.startsWith('CLEAR:')) {
        document.getElementById('statusText').innerText = 'FINISH!';
        playBeep(220, 0.5); // 終了音
      }
    }

    // 画面のカウントダウン演出（3, 2, 1）
    function runCountdownUI() {
      let count = 3;
      document.getElementById('statusText').innerText = count;
      playBeep(440, 0.15); // ピッ音

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          document.getElementById('statusText').innerText = count;
          playBeep(440, 0.15); // ピッ音
        } else {
          clearInterval(timer);
          // 0（起立の瞬間）はESP32からの「GAME_START」受信で『GO!!』表示に切り替わります
        }
      }, 1000);
    }
  </script>
</body>
</html>
