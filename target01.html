<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ESP32 Target Monitor</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1f2833;
      --accent-color: #66fcf1;
      --accent-orange: #ff3e3e;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 8px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .status-text {
      font-size: 13px;
      color: #c5c6c7;
      font-weight: bold;
    }
    .status-text.online { color: var(--accent-color); }

    .btn-connect {
      background: #45a29e;
      color: #fff;
      border: none;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    .mode-container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .mode-btn {
      background: var(--card-bg);
      border: 2px solid #0b0c10;
      color: #c5c6c7;
      padding: 6px 4px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      line-height: 1.2;
    }
    .mode-btn.active {
      border-color: var(--accent-color);
      color: var(--accent-color);
      background: rgba(102, 252, 241, 0.1);
    }

    .display-screen {
      flex: 1;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 2px solid #1f2833;
      position: relative;
      margin-bottom: 8px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }

    .btn-stop-corner {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 62, 62, 0.2);
      border: 2px solid var(--accent-orange);
      color: var(--accent-orange);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 900;
      border-radius: 20px;
      cursor: pointer;
      z-index: 10;
    }

    .display-title {
      font-size: 13px;
      color: #c5c6c7;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .main-val {
      font-size: clamp(55px, 16vw, 100px);
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      font-family: 'Impact', 'Arial Black', sans-serif;
      text-shadow: 0 0 20px rgba(255,255,255,0.2);
      transition: transform 0.1s ease;
    }
    
    .main-val.pop {
      transform: scale(1.15);
      color: var(--accent-color);
    }
    .main-val.countdown {
      color: var(--accent-orange);
      font-size: clamp(80px, 25vw, 140px);
    }

    .sub-val {
      font-size: clamp(14px, 3.8vw, 22px);
      color: var(--accent-color);
      margin-top: 10px;
      font-weight: bold;
    }

    .btn-start {
      background: var(--accent-color);
      color: #0b0c10;
      border: none;
      padding: 14px;
      font-size: 18px;
      font-weight: 900;
      border-radius: 12px;
      width: 100%;
      letter-spacing: 2px;
      box-shadow: 0 4px 15px rgba(102, 252, 241, 0.3);
      cursor: pointer;
      margin-bottom: 6px;
    }

    .log-box {
      background: #000;
      color: #00ff00;
      font-family: monospace;
      padding: 6px 10px;
      border-radius: 8px;
      height: 45px;
      overflow-y: scroll;
      text-align: left;
      font-size: 10px;
      border: 1px solid #1f2833;
    }
  </style>
</head>
<body>

  <div class="header">
    <div id="status" class="status-text">未接続</div>
    <button class="btn-connect" onclick="connectBT()">BT接続</button>
  </div>

  <div class="mode-container">
    <div id="mode1-btn" class="mode-btn active" onclick="selectMode('1')">
      ① タイムアタック<br><small>(60秒スコア)</small>
    </div>
    <div id="mode2-btn" class="mode-btn" onclick="selectMode('2')">
      ② スピードクリア<br><small>(4個クリア)</small>
    </div>
    <div id="mode3-btn" class="mode-btn" onclick="selectMode('3')">
      ③ モグラたたき<br><small>(ランダム60秒)</small>
    </div>
  </div>

  <div class="display-screen">
    <button class="btn-stop-corner" onclick="stopGame()">⏹ 中止</button>

    <div id="display-title" class="display-title">READY</div>
    <div id="main-val" class="main-val">READY</div>
    <div id="sub-val" class="sub-val"></div>
  </div>

  <button class="btn-start" onclick="startGame()">▶ START</button>

  <div id="log" class="log-box">接続待ち...</div>

  <script>
    const SERVICE_UUID           = "00001101-0000-1000-8000-00805f9b34fb";
    const CHARACTERISTIC_UUID_RX = "00001102-0000-1000-8000-00805f9b34fb";
    const CHARACTERISTIC_UUID_TX = "00001103-0000-1000-8000-00805f9b34fb";

    let bluetoothDevice;
    let rxCharacteristic;
    let currentMode = '1';

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep(freq, duration, type = 'square') {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.9, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.error("Audio Error:", e);
      }
    }

    // 2秒間のサイレン風アラート音
    function playAlertSound() {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        
        for (let i = 0; i < 10; i++) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(i % 2 === 0 ? 1200 : 1800, now + (i * 0.2));
          
          gain.gain.setValueAtTime(0.8, now + (i * 0.2));
          gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.2) + 0.18);
          
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          
          osc.start(now + (i * 0.2));
          osc.stop(now + (i * 0.2) + 0.18);
        }
      } catch (e) {
        console.error("Alert Sound Error:", e);
      }
    }

    function selectMode(mode) {
      currentMode = mode;
      document.getElementById('mode1-btn').classList.toggle('active', mode === '1');
      document.getElementById('mode2-btn').classList.toggle('active', mode === '2');
      document.getElementById('mode3-btn').classList.toggle('active', mode === '3');
      resetDisplay();
    }

    function resetDisplay() {
      const title = document.getElementById('display-title');
      const main = document.getElementById('main-val');
      const sub = document.getElementById('sub-val');
      
      main.className = 'main-val';
      sub.innerText = '';

      if (currentMode === '1') {
        title.innerText = "TIME ATTACK";
        main.innerText = "60s";
      } else if (currentMode === '2') {
        title.innerText = "SPEED CLEAR";
        main.innerText = "0.00s";
      } else {
        title.innerText = "WHACK-A-MOLE";
        main.innerText = "60s";
      }
    }

    async function connectBT() {
      initAudio();
      try {
        document.getElementById('status').innerText = '検索中...';
        
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
        
        const txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);
        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', handleData);

        const statusEl = document.getElementById('status');
        statusEl.innerText = '接続完了';
        statusEl.classList.add('online');
        log('--- 接続完了！ ---');

      } catch (error) {
        console.error(error);
        document.getElementById('status').innerText = '接続失敗';
        log('エラー: ' + error);
      }
    }

    async function startGame() {
      initAudio();
      if (!rxCharacteristic) {
        alert('先に「BT接続」を行ってください。');
        return;
      }
      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(currentMode));
      } catch (error) {
        log('送信エラー: ' + error);
      }
    }

    async function stopGame() {
      initAudio();
      if (!rxCharacteristic) {
        resetDisplay();
        return;
      }
      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode('0'));
        log('>>> 中止送信');
        
        const title = document.getElementById('display-title');
        const main = document.getElementById('main-val');
        const sub = document.getElementById('sub-val');
        
        title.innerText = "STOPPED";
        main.className = 'main-val';
        main.innerText = "CANCEL";
        sub.innerText = "中止されました";

        setTimeout(resetDisplay, 1500);
      } catch (error) {
        log('中止送信エラー: ' + error);
        resetDisplay();
      }
    }

    function handleData(event) {
      const decoder = new TextDecoder('utf-8');
      const text = decoder.decode(event.target.value);
      log(text);

      const main = document.getElementById('main-val');
      const title = document.getElementById('display-title');
      const sub = document.getElementById('sub-val');

      if (text.includes("3...")) {
        title.innerText = "GET READY";
        main.innerText = "3";
        main.className = 'main-val countdown';
        playBeep(880, 0.2);
      } else if (text.includes("2...")) {
        main.innerText = "2";
        playBeep(880, 0.2);
      } else if (text.includes("1...")) {
        main.innerText = "1";
        playBeep(880, 0.2);
      } else if (text.includes("GO!!")) {
        title.innerText = "FIRE!!";
        main.innerText = "GO!";
        main.className = 'main-val pop';
        playBeep(1760, 1.0, 'sawtooth');
        
        setTimeout(() => {
          if (currentMode === '1' || currentMode === '3') {
            main.className = 'main-val';
            main.innerText = "0 点";
          }
        }, 800);
      }

      if (text.includes("SPEED_UP")) {
        sub.innerText = "🚨 SPEED UP!! (1秒モード)";
        playAlertSound();
      }

      if (text.includes("スコア:")) {
        const match = text.match(/スコア:\s*(\d+)/);
        if (match) {
          title.innerText = "SCORE";
          main.innerText = match[1] + " 点";
          main.classList.add('pop');
          playBeep(1200, 0.1, 'sine');
          setTimeout(() => main.classList.remove('pop'), 200);
        }
      }

      if (text.includes("残り時間:")) {
        const match = text.match(/残り時間:\s*(\d+)/);
        if (match) {
          const sec = parseInt(match[1]);
          if (currentMode === '3' && sec <= 20 && sec > 0) {
            sub.innerText = "🔥 SPEED UP!! 残り " + sec + " 秒";
          } else {
            sub.innerText = "⏰ 残り " + sec + " 秒";
          }
        }
      }

      if (text.includes("クリアタイム:")) {
        const match = text.match(/クリアタイム:\s*([\d\.]+)/);
        if (match) {
          title.innerText = "CLEAR TIME!";
          main.innerText = match[1] + "s";
          main.className = 'main-val pop';
          sub.innerText = "🏁 CLEAR!!";
          playBeep(1500, 0.4);
        }
      }

      if (text.includes("TIME UP!")) {
        title.innerText = "FINISH";
        sub.innerText = "タイムアップ！";
        playBeep(440, 0.8, 'sawtooth');
      }
    }

    function log(msg) {
      const logBox = document.getElementById('log');
      logBox.innerHTML += msg.replace(/\n/g, '<br>');
      logBox.scrollTop = logBox.scrollHeight;
    }

    selectMode('1');
  </script>
</body>
</html>
