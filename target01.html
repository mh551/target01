<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ターゲットシューティング コントローラー</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d0e12;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 20px 15px;
    }

    header {
      width: 100%;
      text-align: center;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: 1px;
      color: #e0e0e0;
      margin-bottom: 8px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      background-color: #2a2c33;
      color: #888;
      transition: all 0.3s ease;
    }

    .status-badge.connected {
      background-color: #1b3a24;
      color: #30d158;
      border: 1px solid #30d158;
    }

    /* メインディスプレイ表示エリア */
    .display-panel {
      width: 100%;
      max-width: 400px;
      background: linear-gradient(145deg, #16181f, #1f222c);
      border-radius: 16px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid #2d313e;
      margin: 15px 0;
    }

    .mode-label {
      font-size: 1rem;
      color: #0a84ff;
      font-weight: 600;
      margin-bottom: 5px;
      min-height: 1.2em;
    }

    .status-text {
      font-size: 2.2rem;
      font-weight: 800;
      min-height: 3.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd60a;
      letter-spacing: 1px;
    }

    .score-text {
      font-size: 3.5rem;
      font-weight: 900;
      color: #ffffff;
      margin-top: 10px;
      font-family: 'Courier New', Courier, monospace;
    }

    /* ボタン配置エリア */
    .control-panel {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-connect {
      background-color: #0a84ff;
      color: #ffffff;
    }

    .btn-mode {
      background-color: #2c2c2e;
      color: #ffffff;
      border: 1px solid #3a3a3c;
    }

    .btn-mode:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-stop {
      background-color: #ff453a;
      color: #ffffff;
      margin-top: 5px;
    }

    .btn-stop:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <h1>TARGET SHOOTING</h1>
    <div id="connectionStatus" class="status-badge">未接続</div>
  </header>

  <div class="display-panel">
    <div id="modeLabel" class="mode-label">モードを選択してください</div>
    <div id="statusText" class="status-text">READY</div>
    <div id="scoreText" class="score-text">00</div>
  </div>

  <div class="control-panel">
    <button id="btnConnect" class="btn-connect" onclick="connectBLE()">
      📡 Bluetooth 接続
    </button>

    <button class="btn-mode" onclick="startGame(1)" disabled>
      ⏱️ 1. タイムアタック (60秒)
    </button>
    <button class="btn-mode" onclick="startGame(2)" disabled>
      ⚡ 2. スピードクリア (全倒し)
    </button>
    <button class="btn-mode" onclick="startGame(3)" disabled>
      👾 3. モグラたたき
    </button>

    <button id="btnStop" class="btn-stop" onclick="stopGame()" disabled>
      🛑 中断 / リセット
    </button>
  </div>

  <script>
    // ----- ESP32スケッチと共通のUUID設定 -----
    const SERVICE_UUID           = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const CHARACTERISTIC_UUID_RX = 'beb5483e-36e1-4688-b7f5-ea07361b26a8'; // ESP32への書き込み
    const CHARACTERISTIC_UUID_TX = '8260c02c-502a-466d-a19e-e31448b1116b'; // ESP32からの通知受信

    let rxCharacteristic = null;
    let audioCtx = null;
    let countdownInterval = null;

    // ----- iOS対応 Web Audio API 電子音合成機能 -----
    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // ブザー音の再生 (周波数, 発音時間, タイプ)
    function playBuzzer(freq, duration, type = 'sine') {
      try {
        initAudioContext();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        // 音量のエンベロープ設定（ノイズ軽減のための減衰）
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.error('Audio playback error:', e);
      }
    }

    // ----- サウンドエフェクト定義 -----
    const SOUNDS = {
      countdownBeep: () => playBuzzer(440, 0.12, 'square'), // 3, 2, 1 ピッ（低め）
      startBeep:     () => playBuzzer(880, 0.4, 'square'),  // 0 / START ピー！（高め）
      hitSound:      () => playBuzzer(523.25, 0.08, 'sine'),// 命中音 (C5)
      clearSound:    () => {                                 // クリアファンファーレ
        playBuzzer(523.25, 0.1, 'triangle');
        setTimeout(() => playBuzzer(659.25, 0.1, 'triangle'), 100);
        setTimeout(() => playBuzzer(783.99, 0.3, 'triangle'), 200);
      },
      timeUpSound:   () => playBuzzer(220, 0.5, 'sawtooth')  // 終了音
    };

    // ----- Web Bluetooth 接続処理 -----
    async function connectBLE() {
      initAudioContext(); // iPhoneでの音声初期化

      try {
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true, // 全機器を許可
          optionalServices: [SERVICE_UUID]
        });

        document.getElementById('connectionStatus').innerText = '接続中...';

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
        const txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);

        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', handleBLEData);

        // UI状態切り替え
        document.getElementById('connectionStatus').innerText = '接続済み';
        document.getElementById('connectionStatus').classList.add('connected');
        document.getElementById('btnConnect').style.display = 'none';

        // モード選択ボタンの有効化
        document.querySelectorAll('.btn-mode').forEach(btn => btn.disabled = false);
        document.getElementById('btnStop').disabled = false;

      } catch (err) {
        console.error('BLE Connection Failed:', err);
        document.getElementById('connectionStatus').innerText = '接続失敗';
      }
    }

    // ----- ゲーム開始コマンド送信 -----
    async function startGame(modeNumber) {
      initAudioContext();
      if (countdownInterval) clearInterval(countdownInterval);

      if (!rxCharacteristic) {
        alert('先にBluetooth接続を行ってください。');
        return;
      }

      // UIの事前初期化
      const modeNames = ['', 'タイムアタック', 'スピードクリア', 'モグラたたき'];
      document.getElementById('modeLabel').innerText = modeNames[modeNumber];
      document.getElementById('scoreText').innerText = '00';
      document.getElementById('statusText').innerText = 'READY';

      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode('START_MODE' + modeNumber));
      } catch (err) {
        console.error('Failed to send start command:', err);
      }
    }

    // ----- ゲーム中断コマンド送信 -----
    async function stopGame() {
      if (countdownInterval) clearInterval(countdownInterval);
      
      if (rxCharacteristic) {
        try {
          const encoder = new TextEncoder();
          await rxCharacteristic.writeValue(encoder.encode('STOP'));
        } catch (err) {
          console.error('Failed to send stop command:', err);
        }
      }

      document.getElementById('modeLabel').innerText = 'モードを選択してください';
      document.getElementById('statusText').innerText = 'READY';
      document.getElementById('scoreText').innerText = '00';
    }

    // ----- ESP32からの通知受信用ハンドラ -----
    function handleBLEData(event) {
      const decoder = new TextDecoder();
      const msg = decoder.decode(event.target.value).trim();
      console.log('Received from ESP32:', msg);

      // ① カウントダウン開始通知
      if (msg === 'COUNTDOWN') {
        runCountdown();
      } 
      // ② ゲームスタート（0の瞬間）通知
      else if (msg === 'GAME_START') {
        document.getElementById('statusText').innerText = 'START!!';
        SOUNDS.startBeep();
      } 
      // ③ ヒット（スコア更新）通知
      else if (msg.startsWith('HIT:')) {
        const score = msg.split(':')[1];
        document.getElementById('scoreText').innerText = String(score).padStart(2, '0');
        SOUNDS.hitSound();
      } 
      // ④ スピードクリア通知
      else if (msg.startsWith('CLEAR:')) {
        const clearTime = msg.split(':')[1];
        document.getElementById('statusText').innerText = 'CLEAR!';
        document.getElementById('scoreText').innerText = clearTime + 's';
        SOUNDS.clearSound();
      } 
      // ⑤ タイムアップ通知
      else if (msg.startsWith('TIME_UP')) {
        const finalScore = msg.split(':')[1];
        document.getElementById('statusText').innerText = 'FINISH!';
        document.getElementById('scoreText').innerText = String(finalScore).padStart(2, '0');
        SOUNDS.timeUpSound();
      }
      // ⑥ モグラたたきスピードアップ（フィーバー）通知
      else if (msg === 'SPEED_UP') {
        document.getElementById('statusText').innerText = 'FEVER!!';
        SOUNDS.clearSound();
      }
    }

    // ----- 画面上のカウントダウン処理 (3, 2, 1) -----
    function runCountdown() {
      let count = 3;
      document.getElementById('statusText').innerText = count;
      SOUNDS.countdownBeep();

      countdownInterval = setInterval(() => {
        count--;
        if (count > 0) {
          document.getElementById('statusText').innerText = count;
          SOUNDS.countdownBeep();
        } else {
          clearInterval(countdownInterval);
          // 0（GAME_START）の表記・音声はESP32からの「GAME_START」受信時に同期発火します
        }
      }, 1000);
    }
  </script>
</body>
</html>
